name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff
        run: ruff check .

      - name: black --check
        run: black --check .

  test:
    name: Tests (pytest + coverage >= 80%)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sistema_eventos
          POSTGRES_USER: sistema_eventos
          POSTGRES_PASSWORD: sistema_eventos_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sistema_eventos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TESTING: "True"
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: "testserver,localhost,127.0.0.1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sistema_eventos
      POSTGRES_USER: sistema_eventos
      POSTGRES_PASSWORD: sistema_eventos_pw

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest (com cobertura, falha se < 80%)
        run: pytest --cov=apps --cov=config --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore
